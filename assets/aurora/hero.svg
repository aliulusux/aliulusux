<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Ali Ulusu (@aliulusux)">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.d1{animation:d1 14s ease-in-out infinite alternate}.d2{animation:d2 18s ease-in-out infinite alternate}.d3{animation:d3 16s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(90px,50px)}}@keyframes d2{to{transform:translate(-120px,60px)}}@keyframes d3{to{transform:translate(110px,-50px)}}
.tw{animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.08}50%{opacity:.85}}
.spin{transform-origin:150px 150px;animation:spin 7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.halo{transform-origin:150px 150px;animation:halo 3.6s ease-in-out infinite}@keyframes halo{50%{transform:scale(1.07);opacity:.35}}
.rise{animation:rise .9s cubic-bezier(.2,.9,.25,1.15) both}@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.chip{animation:rise .7s cubic-bezier(.2,.9,.25,1.2) both}
.ph{opacity:0;animation:ph 15s linear infinite}@keyframes ph{0%,31.333333333333332%{opacity:1}33.333333333333336%,100%{opacity:0}}
.ty{animation:ty 15s steps(32) infinite}@keyframes ty{0%{width:0}15.000000000000002%,100%{width:var(--w)}}
.star{transform-box:fill-box;transform-origin:center;animation:shoot 9s linear infinite}@keyframes shoot{0%{transform:translate(-120px,-40px);opacity:0}4%{opacity:1}14%{transform:translate(620px,190px);opacity:0}100%{opacity:0;transform:translate(620px,190px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<defs>
<linearGradient id="brand" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#6c7cff"/><stop offset=".5" stop-color="#b56bff"/><stop offset="1" stop-color="#ff5fd2"/></linearGradient>
<linearGradient id="edge" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#6c7cff" stop-opacity=".9"/><stop offset=".5" stop-color="#34306a"/><stop offset="1" stop-color="#ff5fd2" stop-opacity=".7"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="998" height="298" rx="22"/></clipPath>
</defs>
<g clip-path="url(#card)"><rect width="1000" height="300" fill="#0b0a1f"/>
<rect width="1000" height="300" fill="#141033"/>
<defs><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter></defs>
<g filter="url(#blur)" opacity=".75">
<circle class="d1" cx="140" cy="45" r="126" fill="#6c7cff"/>
<circle class="d2" cx="740" cy="15" r="108" fill="#b56bff"/>
<circle class="d3" cx="560" cy="315" r="120" fill="#ff5fd2"/>
</g>
<circle class="tw" style="animation-delay:0s" cx="0" cy="0" r="1" fill="#fff"/><circle class="tw" style="animation-delay:0.37s" cx="379" cy="137" r="1.5" fill="#fff"/><circle class="tw" style="animation-delay:0.74s" cx="758" cy="274" r="2" fill="#fff"/><circle class="tw" style="animation-delay:1.1099999999999999s" cx="137" cy="111" r="1" fill="#fff"/><circle class="tw" style="animation-delay:1.48s" cx="516" cy="248" r="1.5" fill="#fff"/><circle class="tw" style="animation-delay:1.85s" cx="895" cy="85" r="2" fill="#fff"/><circle class="tw" style="animation-delay:2.2199999999999998s" cx="274" cy="222" r="1" fill="#fff"/><circle class="tw" style="animation-delay:2.59s" cx="653" cy="59" r="1.5" fill="#fff"/><circle class="tw" style="animation-delay:2.96s" cx="32" cy="196" r="2" fill="#fff"/><circle class="tw" style="animation-delay:3.33s" cx="411" cy="33" r="1" fill="#fff"/><circle class="tw" style="animation-delay:3.7s" cx="790" cy="170" r="1.5" fill="#fff"/><circle class="tw" style="animation-delay:0.07000000000000028s" cx="169" cy="7" r="2" fill="#fff"/><circle class="tw" style="animation-delay:0.4399999999999995s" cx="548" cy="144" r="1" fill="#fff"/><circle class="tw" style="animation-delay:0.8099999999999996s" cx="927" cy="281" r="1.5" fill="#fff"/><circle class="tw" style="animation-delay:1.1799999999999997s" cx="306" cy="118" r="2" fill="#fff"/><circle class="tw" style="animation-delay:1.5499999999999998s" cx="685" cy="255" r="1" fill="#fff"/><circle class="tw" style="animation-delay:1.92s" cx="64" cy="92" r="1.5" fill="#fff"/><circle class="tw" style="animation-delay:2.29s" cx="443" cy="229" r="2" fill="#fff"/><circle class="tw" style="animation-delay:2.66s" cx="822" cy="66" r="1" fill="#fff"/><circle class="tw" style="animation-delay:3.0300000000000002s" cx="201" cy="203" r="1.5" fill="#fff"/><circle class="tw" style="animation-delay:3.4000000000000004s" cx="580" cy="40" r="2" fill="#fff"/><circle class="tw" style="animation-delay:3.7699999999999996s" cx="959" cy="177" r="1" fill="#fff"/><circle class="tw" style="animation-delay:0.14000000000000057s" cx="338" cy="14" r="1.5" fill="#fff"/><circle class="tw" style="animation-delay:0.5099999999999998s" cx="717" cy="151" r="2" fill="#fff"/><circle class="tw" style="animation-delay:0.879999999999999s" cx="96" cy="288" r="1" fill="#fff"/><circle class="tw" style="animation-delay:1.25s" cx="475" cy="125" r="1.5" fill="#fff"/>
<path class="star" d="M240 20 l-90 -28" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0"/>
<rect x="22" y="22" width="956" height="256" rx="18" fill="#0b0a1f" fill-opacity=".42" stroke="#fff" stroke-opacity=".1"/>
<circle class="halo" cx="150" cy="150" r="104" fill="none" stroke="#b56bff" stroke-width="10" opacity=".65" style="filter:blur(10px)"/>
<circle class="spin" cx="150" cy="150" r="96" fill="none" stroke="url(#brand)" stroke-width="5" stroke-linecap="round" stroke-dasharray="210 92"/>
<clipPath id="face"><circle cx="150" cy="150" r="86"/></clipPath>
<image href="data:image/jpeg;base64," x="64" y="64" width="172" height="172" clip-path="url(#face)" preserveAspectRatio="xMidYMid slice"/>
<g class="rise"><text x="290" y="82" font-size="16" letter-spacing="3" font-weight="700" fill="#ff5fd2" class="mono">@aliulusux</text></g>
<g class="rise" style="animation-delay:.12s"><text x="288" y="146" font-size="62" font-weight="800" letter-spacing="-1.5" fill="url(#brand)">Ali Ulusu</text></g>
<g class="ph" style="animation-delay:0s">
<clipPath id="ty0"><rect class="ty" style="--w:353.40000000000003px;animation-delay:0s" x="290" y="168" height="32" width="353.40000000000003"/></clipPath>
<text clip-path="url(#ty0)" x="290" y="190" font-size="20" class="mono" fill="#f3f1ff" opacity=".88">Building things with JavaScript</text></g><g class="ph" style="animation-delay:5s">
<clipPath id="ty1"><rect class="ty" style="--w:205.20000000000002px;animation-delay:5s" x="290" y="168" height="32" width="205.20000000000002"/></clipPath>
<text clip-path="url(#ty1)" x="290" y="190" font-size="20" class="mono" fill="#f3f1ff" opacity=".88">Learning in public</text></g><g class="ph" style="animation-delay:10s">
<clipPath id="ty2"><rect class="ty" style="--w:330.6px;animation-delay:10s" x="290" y="168" height="32" width="330.6"/></clipPath>
<text clip-path="url(#ty2)" x="290" y="190" font-size="20" class="mono" fill="#f3f1ff" opacity=".88">Always shipping something new</text></g>
<g class="chip" style="animation-delay:0.5s">
<rect x="290" y="218" width="120" height="34" rx="17" fill="#0b0a1f" fill-opacity=".55" stroke="#6c7cff" stroke-opacity=".6"/>
<text x="350" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#f3f1ff">JavaScript</text></g><g class="chip" style="animation-delay:0.64s">
<rect x="420" y="218" width="120" height="34" rx="17" fill="#0b0a1f" fill-opacity=".55" stroke="#6c7cff" stroke-opacity=".6"/>
<text x="480" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#f3f1ff">TypeScript</text></g><g class="chip" style="animation-delay:0.78s">
<rect x="550" y="218" width="59.8" height="34" rx="17" fill="#0b0a1f" fill-opacity=".55" stroke="#6c7cff" stroke-opacity=".6"/>
<text x="579.9" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#f3f1ff">CSS</text></g><g class="chip" style="animation-delay:0.92s">
<rect x="619.8" y="218" width="68.4" height="34" rx="17" fill="#0b0a1f" fill-opacity=".55" stroke="#6c7cff" stroke-opacity=".6"/>
<text x="654" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#f3f1ff">SCSS</text></g></g>
<rect x="1" y="1" width="998" height="298" rx="22" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
