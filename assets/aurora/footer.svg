<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" role="img" aria-label="Thanks for stopping by">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.w1{animation:w 9s linear infinite}.w2{animation:w 14s linear infinite reverse}@keyframes w{to{transform:translateX(-1000px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<defs>
<linearGradient id="brand" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#6c7cff"/><stop offset=".5" stop-color="#b56bff"/><stop offset="1" stop-color="#ff5fd2"/></linearGradient>
<linearGradient id="edge" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#6c7cff" stop-opacity=".9"/><stop offset=".5" stop-color="#34306a"/><stop offset="1" stop-color="#ff5fd2" stop-opacity=".7"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="998" height="118" rx="22"/></clipPath>
</defs>
<g clip-path="url(#card)"><rect width="1000" height="120" fill="#0b0a1f"/>
<rect width="1000" height="120" fill="#0f0d28"/>
<path class="w1" d="M0 70Q125 44 250 70T500 70T750 70T1000 70T1250 70T1500 70T1750 70T2000 70V120H0Z" fill="#6c7cff" opacity=".35"/>
<path class="w2" d="M0 84Q125 64 250 84T500 84T750 84T1000 84T1250 84T1500 84T1750 84T2000 84V120H0Z" fill="#ff5fd2" opacity=".3"/>
<text x="500" y="46" text-anchor="middle" font-size="17" font-weight="600" fill="#f3f1ff" class="mono">thanks for stopping by.</text></g>
<rect x="1" y="1" width="998" height="118" rx="22" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
