<svg xmlns="http://www.w3.org/2000/svg" width="490" height="170" viewBox="0 0 490 170" role="img" aria-label="anizm-clone repository">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.in{animation:in .8s 0.24s cubic-bezier(.2,.9,.25,1.1) both}@keyframes in{from{opacity:0;transform:translateY(12px)}}
.glow{animation:glow 6s 2s ease-in-out infinite alternate}@keyframes glow{from{transform:translateX(-60px);opacity:.25}to{transform:translateX(320px);opacity:.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<defs>
<linearGradient id="brand" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#ff5c39"/><stop offset=".5" stop-color="#ff9a3d"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
<linearGradient id="edge" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ff5c39" stop-opacity=".9"/><stop offset=".5" stop-color="#5a2a20"/><stop offset="1" stop-color="#ffd166" stop-opacity=".7"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="488" height="168" rx="22"/></clipPath>
</defs>
<g clip-path="url(#card)"><rect width="490" height="170" fill="#150909"/>
<rect width="490" height="170" fill="#190b0a"/>
<defs><filter id="soft" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="34"/></filter></defs>
<circle class="glow" cx="120" cy="20" r="70" fill="#ff9a3d" filter="url(#soft)"/>
<g class="in">
<text x="28" y="54" font-size="24" font-weight="800" fill="url(#brand)">anizm-clone</text>
<text x="28" y="88" font-size="15" fill="#c49a86">Anizm Clone</text>
<circle cx="35" cy="140" r="6" fill="#f1e05a"/><text x="50" y="145" font-size="13" fill="#fff3e6">JavaScript</text>
<text x="462" y="145" text-anchor="end" font-size="13" fill="#c49a86" class="mono">★ 0</text>
</g></g>
<rect x="1" y="1" width="488" height="168" rx="22" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
